<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Danz - Otaku Over Power Edition</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

    :root {
      --bg-dark: #0f1115;
      --bg-panel: #1a1c23;
      --primary: #3b82f6; 
      --primary-hover: #2563eb;
      --accent: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-dark); }
    ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }

    header {
      position: fixed; width: 100%; top: 0; z-index: 1000;
      background: #13151a; border-bottom: 2px solid #1f222b;
      padding: 10px 4%; display: flex; flex-direction: column; gap: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .logo { font-size: 1.5rem; font-weight: 900; color: #fff; text-decoration: none; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
    .logo i { color: var(--primary); }
    
    .search-box { display: flex; align-items: center; background: #0b0d10; padding: 6px 12px; border-radius: 6px; border: 1px solid #2a2d35; width: 100%; max-width: 250px; }
    .search-box input { background: transparent; border: none; outline: none; color: #fff; width: 100%; font-weight: 600; font-size: 0.85rem; }
    .search-box button { background: none; border: none; color: var(--primary); cursor: pointer; font-size: 1rem; }

    nav { display: flex; gap: 8px; overflow-x: auto; width: 100%; padding-bottom: 5px; white-space: nowrap; }
    .nav-btn { background: #1a1c23; border: 1px solid #2a2d35; color: var(--text-muted); font-size: 0.85rem; font-weight: 800; cursor: pointer; padding: 6px 14px; border-radius: 4px; transition: 0.2s; flex-shrink: 0; }
    .nav-btn.active, .nav-btn:hover { color: #fff; background: var(--primary); border-color: var(--primary); }

    main { padding: 130px 4% 60px; max-width: 1400px; margin: 0 auto; }
    .section-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #1f222b; padding-bottom: 10px; margin-bottom: 20px; }
    .section-title { font-size: 1.2rem; font-weight: 900; color: #fff; display: flex; align-items: center; gap: 10px; border-left: 4px solid var(--primary); padding-left: 10px; }
    
    .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
    @media (min-width: 768px) { .anime-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; } header { flex-direction: row; padding: 15px 5%; } .search-box { max-width: 220px; } main { padding-top: 90px; } }

    .anime-card { background: var(--bg-panel); border-radius: 8px; overflow: hidden; cursor: pointer; position: relative; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .anime-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.6); }
    
    .poster-box { position: relative; padding-top: 140%; }
    .poster-box img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    .ep-badge { position: absolute; top: 8px; right: 8px; background: var(--primary); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 800; }
    .type-badge { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.8); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 800; border: 1px solid #333; }
    
    .anime-info { padding: 10px; }
    .anime-title { font-size: 0.9rem; font-weight: 800; line-height: 1.3; margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: #fff; }
    .anime-meta { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; display: flex; justify-content: space-between; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.96); z-index: 9999; justify-content: center; align-items: center; padding: 0; }
    .modal.active { display: flex; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    
    .modal-content { background: var(--bg-dark); width: 100%; max-width: 1100px; height: 100vh; display: flex; flex-direction: column; position: relative; }
    @media (min-width: 1024px) { .modal { padding: 20px; } .modal-content { height: auto; border-radius: 8px; max-height: 95vh; overflow: hidden; border: 1px solid #333; } }

    .close-btn { position: absolute; top: 10px; right: 15px; font-size: 1.4rem; color: #fff; cursor: pointer; z-index: 100; background: rgba(0,0,0,0.7); width: 38px; height: 38px; border-radius: 50%; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
    .close-btn:hover { background: var(--accent); }
    
    .player-box { position: relative; width: 100%; padding-top: 56.25%; background: #000; flex-shrink: 0; border-bottom: 2px solid var(--primary); }
    /* PENGAMANAN IFRAME ANTI-BLOKIR: menggunakan referrerpolicy="no-referrer" */
    .player-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; z-index: 2; background: #000; }

    .ad-shield { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; background: transparent; display: block; cursor: pointer; }
    .ad-shield.hidden { display: none; }

    .controls-box { padding: 15px; overflow-y: auto; background: var(--bg-panel); flex-grow: 1; }
    
    .server-list { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; background: #13151a; padding: 12px; border-radius: 6px; border: 1px solid #1f222b; }
    .server-list p { width: 100%; font-weight: 800; color: #fff; margin-bottom: 5px; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
    .server-list p i { color: var(--primary); }
    .btn-server { background: #2a2d35; color: #fff; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-weight: 700; transition: 0.2s; font-size: 0.8rem; }
    .btn-server.active { background: var(--primary); color: #fff; }

    .episode-section { margin-top: 10px; }
    .ep-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background: var(--primary); padding: 8px 12px; border-radius: 6px; }
    .ep-header p { font-weight: 800; color: #fff; font-size: 0.9rem; margin: 0; }
    .select-season { background: #fff; color: #000; border: none; padding: 5px 10px; border-radius: 4px; font-weight: 800; outline: none; cursor: pointer; font-size: 0.85rem; }
    
    .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); gap: 6px; max-height: 200px; overflow-y: auto; padding: 5px; background: #13151a; border: 1px solid #1f222b; border-radius: 6px; }
    .btn-ep { background: #2a2d35; color: #fff; border: 1px solid #333; padding: 8px 4px; border-radius: 4px; font-weight: 800; cursor: pointer; transition: 0.2s; text-align: center; font-size: 0.85rem; }
    .btn-ep:hover { background: #3a3f4a; }
    .btn-ep.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .loader { border: 4px solid #1f222b; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 50px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <a href="#" class="logo" onclick="loadCategory('trending')"><i class="fa-solid fa-play"></i> STREAM<span>DANZ</span></a>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Cari Anime...">
        <button onclick="searchAnime()"><i class="fa-solid fa-search"></i></button>
      </div>
    </div>
    <nav>
      <button class="nav-btn active" id="btn-trending" onclick="loadCategory('trending')">Ongoing</button>
      <button class="nav-btn" id="btn-top" onclick="loadCategory('top')">Populer</button>
      <button class="nav-btn" id="btn-movie" onclick="loadCategory('movie')">Movie</button>
      <button class="nav-btn" id="btn-action" onclick="loadGenre(16, 'Action')">Action</button>
      <button class="nav-btn" id="btn-romance" onclick="loadGenre(10749, 'Romance')">Romance</button>
      <button class="nav-btn" id="btn-fantasy" onclick="loadGenre(10765, 'Fantasy')">Fantasy</button>
    </nav>
  </header>

  <main>
    <div class="section-header">
      <div class="section-title" id="page-title">Anime Ongoing (Musim Ini)</div>
    </div>
    <div class="anime-grid" id="anime-container"><div class="loader"></div></div>
  </main>

  <div class="modal" id="player-modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></span>
      
      <div class="player-box">
        <div class="ad-shield" id="adShield" onclick="removeShield()"></div>
        <!-- POLICY INI WAJIB AGAR SERVER TIDAK BISA MELACAK GITHUB PAGES -->
        <iframe id="video-frame" src="" allowfullscreen allow="autoplay; encrypted-media" referrerpolicy="no-referrer"></iframe>
      </div>

      <div class="controls-box">
        <div class="server-list">
          <p><i class="fa-solid fa-tower-broadcast"></i> Pilih Server Gacor (Anti Error):</p>
          <button class="btn-server active" id="sv1" onclick="setServer(1)">AutoEmbed</button>
          <button class="btn-server" id="sv2" onclick="setServer(2)">Embed SU</button>
          <button class="btn-server" id="sv3" onclick="setServer(3)">VidLink</button>
          <button class="btn-server" id="sv4" onclick="setServer(4)">MultiEmbed</button>
        </div>

        <div class="episode-section" id="ep-section">
          <div class="ep-header">
            <p>Daftar Episode & Season</p>
            <select id="season-selector" class="select-season" onchange="changeSeason()"></select>
          </div>
          <div class="ep-grid" id="ep-list"></div>
        </div>
      </div>
    </div>
  </div>
<script>
    const API_KEYS = [
      '8d6d91941230817f7807d643736e8a49', 
      '04c35731a5ee918f014970082a0088b1',
      '284243b566580f146a48a43653199859',
      '3e6a392110bd0ceee096b02a249c5eeb',
      'e950a41da8093153b47c0b0292bc239f'
    ];
    let keyIndex = 0;
    function getKey() { return API_KEYS[keyIndex]; }

    const BASE_URL = 'https://api.themoviedb.org/3';
    const IMG_URL = 'https://image.tmdb.org/t/p/w500';

    let activeId = '';
    let isMovie = false;
    let activeServer = 1;
    let activeSeason = 1;
    let activeEpisode = 1;

    /* INJEKSI VIP ANIME: Paksa muncul di halaman utama dengan ID resmi yang memiliki daftar episode lengkap */
    const VIP_ANIME = [
      { id: 219717, name: "Wind Breaker", title: "Wind Breaker", poster_path: "/e1zYj7jB4Zq9c9o5l0qG3rY1v5u.jpg", vote_average: 8.5, first_air_date: "2024-04-05", media_type: "tv", genre_ids: [16] },
      { id: 114884, name: "Tokyo Revengers", title: "Tokyo Revengers", poster_path: "/7E8vLz3C3h0W8xJ0z9wQ6p5k2r7.jpg", vote_average: 8.5, first_air_date: "2021-04-11", media_type: "tv", genre_ids: [16] },
      { id: 211696, name: "Solo Leveling", title: "Solo Leveling", poster_path: "/geuzteox8m9C0Y9n0p9j5oBStzD.jpg", vote_average: 8.6, first_air_date: "2024-01-07", media_type: "tv", genre_ids: [16] },
      { id: 37854, name: "One Piece", title: "One Piece", poster_path: "/fcXdMwtgqEXeG8q8J2s2lWz34rT.jpg", vote_average: 8.7, first_air_date: "1999-10-20", media_type: "tv", genre_ids: [16] }
    ];

    /* DAFTAR HITAM MUTLAK: 100088 adalah ID untuk OVERFLOW! Semua anime dewasa diblokir keras di sini */
    const BLACKLIST_IDS = [
      100088, /* Overflow - TERSANGKA UTAMA */
      204324, 235483, 70884, 215233, 155551, 126315, 213345, 134179, 116239, 999999, 127532, 125184, 83121, 74744
    ]; 
    
    const FORBIDDEN_KEYWORDS = [
      'overflow', 'おーばーふろぉ', 'mori no kuma', 'secret mission', 'souryo', 'xian', 'adult', 'subete', 
      '森のくまさん', 'しーくれっとみっしょん', '僧侶', '色欲', 'hentai', 'ecchi'
    ];

    const ANIME_FILTER = '&with_original_language=ja&with_genres=16&include_adult=false';

    window.onload = () => {
      loadCategory('trending');
      document.getElementById('search-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') searchAnime();
      });
    };

    function resetNavActive() {
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
    }

    function loadCategory(type) {
      resetNavActive();
      const btn = document.getElementById(`btn-${type}`);
      if(btn) btn.classList.add('active');
      document.getElementById('search-input').value = '';

      let endpoint = '';
      let isHome = false;
      if (type === 'trending') {
        document.getElementById('page-title').innerText = 'Anime Ongoing (Musim Ini)';
        endpoint = `/discover/tv?sort_by=popularity.desc${ANIME_FILTER}`;
        isHome = true;
      } else if (type === 'top') {
        document.getElementById('page-title').innerText = 'Anime Populer Sepanjang Masa';
        endpoint = `/discover/tv?sort_by=vote_average.desc&vote_count.gte=300${ANIME_FILTER}`;
        isHome = true;
      } else if (type === 'movie') {
        document.getElementById('page-title').innerText = 'Anime Movie Terlaris';
        endpoint = `/discover/movie?sort_by=popularity.desc${ANIME_FILTER}`;
      }
      fetchData(endpoint, type === 'movie', false, 0, isHome);
    }

    function loadGenre(genreId, genreName) {
      resetNavActive();
      const btn = document.getElementById(`btn-${genreName.toLowerCase()}`);
      if(btn) btn.classList.add('active');
      document.getElementById('page-title').innerText = `Kategori Anime: ${genreName}`;
      fetchData(`/discover/tv?sort_by=popularity.desc&with_genres=16,${genreId}&with_original_language=ja&include_adult=false`, false);
    }

    function searchAnime() {
      const query = document.getElementById('search-input').value.trim();
      if (!query) return;
      resetNavActive();
      document.getElementById('page-title').innerText = `Hasil Pencarian: "${query}"`;
      fetchData(`/search/multi?query=${encodeURIComponent(query)}&include_adult=false`, null, true);
    }

    async function fetchData(endpoint, forceMovieFlag = false, isSearch = false, retryCount = 0, isHome = false) {
      const container = document.getElementById('anime-container');
      if (retryCount === 0) container.innerHTML = '<div class="loader" style="grid-column: 1/-1;"></div>';

      try {
        const url = `${BASE_URL}${endpoint}&api_key=${getKey()}&language=id-ID`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.success === false || data.status_code === 7 || data.status_code === 34) {
          if (retryCount < API_KEYS.length - 1) {
            keyIndex++;
            return fetchData(endpoint, forceMovieFlag, isSearch, retryCount + 1, isHome);
          } else {
            renderList(container, VIP_ANIME, forceMovieFlag, isSearch);
            return;
          }
        }

        let finalResults = data.results || [];

        // GABUNGKAN ANIME VIP JIKA SEDANG DI HALAMAN UTAMA ONGOING/POPULER
        if (isHome) {
            finalResults = finalResults.filter(item => !VIP_ANIME.some(vip => vip.id === item.id));
            finalResults = [...VIP_ANIME, ...finalResults];
        }

        renderList(container, finalResults, forceMovieFlag, isSearch);

      } catch (err) {
        renderList(container, VIP_ANIME, forceMovieFlag, isSearch);
      }
    }

    function renderList(container, resultsList, forceMovieFlag, isSearch) {
        container.innerHTML = '';
        
        if (resultsList.length === 0) {
            container.innerHTML = '<p style="color:#fff; padding:20px;">Tidak ada hasil.</p>';
            return;
        }

        resultsList.forEach(item => {
          // BLOKIR KERAS ANIME DEWASA
          if (item.adult === true) return;
          if (BLACKLIST_IDS.includes(item.id)) return;
          
          const titleLower = (item.name || item.title || item.original_name || '').toLowerCase();
          if (FORBIDDEN_KEYWORDS.some(keyword => titleLower.includes(keyword))) return;

          if (isSearch && (item.original_language !== 'ja' || !(item.genre_ids && item.genre_ids.includes(16)))) return;

          const displayTitle = item.name || item.title;
          const poster = item.poster_path ? `${IMG_URL}${item.poster_path}` : 'https://via.placeholder.com/300x450?text=No+Poster';
          const rating = item.vote_average ? item.vote_average.toFixed(1) : '?';
          const mediaType = forceMovieFlag ? 'movie' : (item.media_type || (item.title ? 'movie' : 'tv'));
          const year = (item.first_air_date || item.release_date || 'N/A').split('-')[0];
          
          const card = document.createElement('div');
          card.className = 'anime-card';
          card.onclick = () => openPlayer(item.id, mediaType === 'movie');
          
          card.innerHTML = `
            <div class="poster-box">
              <img src="${poster}" alt="${displayTitle}" loading="lazy">
              <span class="ep-badge"><i class="fa-solid fa-star"></i> ${rating}</span>
              <span class="type-badge">${mediaType === 'movie' ? 'Movie' : 'TV Series'}</span>
            </div>
            <div class="anime-info">
              <div class="anime-title">${displayTitle}</div>
              <div class="anime-meta"><span>Jepang</span><span>${year}</span></div>
            </div>`;
          container.appendChild(card);
        });
    }

    async function openPlayer(id, isMovieFormat) {
      activeId = id;
      isMovie = isMovieFormat;
      activeSeason = 1;
      activeEpisode = 1;

      document.getElementById('adShield').classList.remove('hidden');
      document.getElementById('player-modal').classList.add('active');
      document.body.style.overflow = 'hidden';

      const epSection = document.getElementById('ep-section');
      if (isMovie) {
        epSection.style.display = 'none';
        refreshIframe();
      } else {
        epSection.style.display = 'block';
        await getSeasons();
      }
      setServer(activeServer);
    }

    function removeShield() {
      document.getElementById('adShield').classList.add('hidden');
    }

    async function getSeasons() {
      const select = document.getElementById('season-selector');
      const epList = document.getElementById('ep-list');
      epList.innerHTML = '<p style="color:#fff; padding:10px;">Memuat data season...</p>';

      try {
        const res = await fetch(`${BASE_URL}/tv/${activeId}?api_key=${getKey()}&language=id-ID`);
        const data = await res.json();
        select.innerHTML = '';
        
        let seasons = data.seasons ? data.seasons.filter(s => s.season_number > 0 && s.episode_count > 0) : [];
        
        if (seasons.length === 0) {
          isMovie = true; 
          document.getElementById('ep-section').style.display = 'none';
          refreshIframe();
          return;
        }

        seasons.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.season_number;
          opt.innerText = `Season ${s.season_number} (${s.episode_count} Ep)`;
          select.appendChild(opt);
        });
        
        activeSeason = seasons[0].season_number;
        await getEpisodes();
      } catch (e) {
        epList.innerHTML = '<p style="color:#ef4444; padding:10px;">Gagal memuat season.</p>';
      }
    }

    function changeSeason() {
      activeSeason = parseInt(document.getElementById('season-selector').value);
      activeEpisode = 1;
      getEpisodes();
    }

    async function getEpisodes() {
      const epList = document.getElementById('ep-list');
      epList.innerHTML = '<p style="color:#fff; padding:10px;">Memuat episode...</p>';
      
      try {
        const res = await fetch(`${BASE_URL}/tv/${activeId}/season/${activeSeason}?api_key=${getKey()}&language=id-ID`);
        const data = await res.json();
        
        epList.innerHTML = '';

        // SISTEM FALLBACK EPISODE: Jika TMDB error dan tidak mengirim data episode
        if (data.episodes && data.episodes.length > 0) {
          data.episodes.forEach(ep => {
            const btn = document.createElement('button');
            btn.className = `btn-ep ${ep.episode_number === activeEpisode ? 'active' : ''}`;
            btn.innerText = `Ep ${ep.episode_number}`;
            btn.onclick = () => {
              activeEpisode = ep.episode_number;
              document.querySelectorAll('.btn-ep').forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
              document.getElementById('adShield').classList.remove('hidden');
              refreshIframe();
            };
            epList.appendChild(btn);
          });
        } else {
          // MEMBUAT TOMBOL MANUAL AGAR TIDAK BLANK
          const btn = document.createElement('button');
          btn.className = `btn-ep active`;
          btn.innerText = `Ep 1 (Fallback)`;
          btn.onclick = () => {
              activeEpisode = 1;
              document.getElementById('adShield').classList.remove('hidden');
              refreshIframe();
          };
          epList.appendChild(btn);
        }
        
        refreshIframe();
      } catch (e) {
        epList.innerHTML = '<p style="color:#ef4444; padding:10px;">Gagal memuat daftar episode.</p>';
      }
    }

    function setServer(num) {
      activeServer = num;
      document.querySelectorAll('.btn-server').forEach(b => b.classList.remove('active'));
      document.getElementById(`sv${num}`).classList.add('active');
      document.getElementById('adShield').classList.remove('hidden');
      refreshIframe();
    }

    function refreshIframe() {
      const iframe = document.getElementById('video-frame');
      let url = '';
      
      /* SERVER ANTI-BLOKIR (Disesuaikan khusus untuk web hosting gratisan seperti Github Pages) */
      if (isMovie) {
        if (activeServer === 1) url = `https://player.autoembed.cc/embed/movie/${activeId}`;
        if (activeServer === 2) url = `https://embed.su/embed/movie/${activeId}`;
        if (activeServer === 3) url = `https://vidlink.pro/movie/${activeId}`;
        if (activeServer === 4) url = `https://multiembed.mov/?video_id=${activeId}&tmdb=1`;
      } else {
        if (activeServer === 1) url = `https://player.autoembed.cc/embed/tv/${activeId}/${activeSeason}/${activeEpisode}`;
        if (activeServer === 2) url = `https://embed.su/embed/tv/${activeId}/${activeSeason}/${activeEpisode}`;
        if (activeServer === 3) url = `https://vidlink.pro/tv/${activeId}/${activeSeason}/${activeEpisode}`;
        if (activeServer === 4) url = `https://multiembed.mov/?video_id=${activeId}&tmdb=1&s=${activeSeason}&e=${activeEpisode}`;
      }
      iframe.src = url;
    }

    function closeModal() {
      document.getElementById('player-modal').classList.remove('active');
      document.getElementById('video-frame').src = '';
      document.body.style.overflow = 'auto';
    }
  </script>
</body>
</html>
